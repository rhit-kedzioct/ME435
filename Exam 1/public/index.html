<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino LED Controller</title>
</head>
<body>
    <h1>Arduino LED Controller</h1>
    <p>Control the built-in LED on the Arduino.</p>

    <button onclick="ledOn()">LED ON</button>
    <button onclick="ledOff()">LED OFF</button>

    <p>
        <label for="flashes">Number of Flashes:</label>
        <input type="number" id="flashes" value="3" min="1" step="1">
    </p>
    <p>
        <label for="period">Period (milliseconds):</label>
        <input type="number" id="period" value="1500" min="1" step="1">
    </p>
    <button onclick="flashLed()">FLASH</button>

    <h3>Server Response:</h3>
    <p id="response">No command sent yet.</p>

    <script src="main.js"></script>
</body>
</html>
